<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>星空 · Starfield</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      overflow: hidden;
      background: #000;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      cursor: default;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    /* --- 信息叠加层 --- */
    .overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }
    .title {
      position: absolute;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,.35);
      font-size: 14px;
      letter-spacing: 4px;
      text-transform: uppercase;
      text-shadow: 0 0 12px rgba(255,255,255,.08);
      transition: opacity 1s;
      user-select: none;
    }
    .title.hidden { opacity: 0; }
    .stats {
      position: absolute;
      top: 20px;
      right: 24px;
      color: rgba(255,255,255,.18);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      text-align: right;
      line-height: 1.6;
      transition: opacity .8s;
      user-select: none;
    }
    .stats.hidden { opacity: 0; }
    .stats span { display: block; }

    /* --- 鼠标指引 --- */
    .hint {
      position: absolute;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,.12);
      font-size: 12px;
      letter-spacing: 2px;
      animation: pulse 3s ease-in-out infinite;
      opacity: 0;
      transition: opacity 1s;
    }
    .hint.show { opacity: 1; }
    @keyframes pulse {
      0%, 100% { opacity: .12; }
      50%      { opacity: .35; }
    }

    /* --- 自定义光标 --- */
    .cursor-glow {
      position: fixed;
      pointer-events: none;
      z-index: 20;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(180,200,255,.06) 0%, transparent 70%);
      transform: translate(-50%, -50%);
      transition: width .3s, height .3s, background .3s;
      will-change: transform;
    }
    .cursor-glow.active {
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, rgba(200,220,255,.12) 0%, transparent 70%);
    }
  </style>
</head>
<body>

  <canvas id="c"></canvas>

  <div class="overlay">
    <div class="stats" id="stats">
      <span id="starCount">0</span>
      <span id="fpsDisplay">--</span>
      <span id="extraInfo"></span>
    </div>
    <div class="title">✦ 星 空 漫 步 ✦</div>
    <div class="hint show" id="hint">移动鼠标 · 星辰追随</div>
  </div>

  <div class="cursor-glow" id="cursorGlow"></div>

  <script>
    // ──────────────────────────────────────────────
    //  星空引擎 — Starfield
    // ──────────────────────────────────────────────

    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const cursorGlow = document.getElementById('cursorGlow');
    const starCountEl = document.getElementById('starCount');
    const fpsEl = document.getElementById('fpsDisplay');
    const extraInfoEl = document.getElementById('extraInfo');
    const hint = document.getElementById('hint');
    const titleEl = document.querySelector('.title');
    const statsEl = document.querySelector('.stats');
    let uiHidden = false;
    let meteorRain = false;

    let W, H;
    let mouse = { x: 0, y: 0, vx: 0, vy: 0, targetX: 0, targetY: 0 };
    let stars = [];
    let shootingStars = [];
    let constellations = [];
    let particleEmitters = [];
    let time = 0;
    let lastFrame = 0;
    let fps = 0;
    let frameCount = 0;
    let fpsTimer = 0;
    let constellationLabels = [];

    // ─── 配置 ─────────────────────────────────────
    const CONFIG = {
      starCount: 600,          // 基础恒星数量
      nebulaCount: 4,          // 星云数量
      maxShootingStars: 3,     // 同时流星数
      shootingStarRate: 0.008, // 每帧生成概率
      parallaxLayers: 3,       // 视差层数
      constellationChance: 0.2,// 星座生成概率
      twinkleSpeed: 2,
      moon: true,              // 显示月亮
      planets: 2,              // 行星数量
    };

    // ─── 工具 ─────────────────────────────────────
    function rand(min, max) { return Math.random() * (max - min) + min; }
    function lerp(a, b, t) { return a + (b - a) * t; }
    function dist(x1, y1, x2, y2) { return Math.hypot(x2 - x1, y2 - y1); }

    // ─── Resize ──────────────────────────────────
    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
      initStars();
    }

    // ─── 恒星 ─────────────────────────────────────
    function createStar(layer) {
      const depth = layer !== undefined
        ? layer / CONFIG.parallaxLayers
        : rand(.1, 1);
      const parallax = .02 + depth * .08;
      const size = .5 + depth * 1.2 + rand(0, .6);
      const twinkleAmp = .3 + depth * .4;

      return {
        x: rand(0, W),
        y: rand(0, H),
        z: depth,
        size,
        baseSize: size,
        parallax,
        twinkleAmp,
        twinkleSpeed: rand(.5, 2.5) * CONFIG.twinkleSpeed,
        twinkleOffset: rand(0, Math.PI * 2),
        hue: rand(190, 280),
        saturation: rand(0, 60),
        luminosity: rand(60, 95),
        layer: layer !== undefined ? layer : Math.floor(depth * CONFIG.parallaxLayers),
        pulse: rand(0, Math.PI * 2),
      };
    }

    function initStars() {
      stars = [];
      for (let i = 0; i < CONFIG.starCount; i++) {
        stars.push(createStar());
      }
      // 额外填充近层让前景更丰富
      for (let i = 0; i < Math.floor(CONFIG.starCount * .4); i++) {
        stars.push(createStar(CONFIG.parallaxLayers - 1));
      }
      updateStarCount();
    }

    function updateStarCount() {
      const cName = constellations.filter(c => c.name).map(c => c.name).join(' ');
      starCountEl.textContent = `✦ ${stars.length} ╱ ${constellations.filter(c => c.name).length} 星座`;
      extraInfoEl.textContent = `${planets.length} 行星 · ${meteorRain ? '☄ 流星雨' : ''}`;
    }

    // ─── 流星 ─────────────────────────────────────
    function spawnShootingStar() {
      if (shootingStars.length >= CONFIG.maxShootingStars) return;
      const angle = rand(-.4, .4) - Math.PI / 2.5;
      const speed = rand(800, 2000);
      const length = rand(80, 250);
      return {
        x: rand(0, W * 1.2) - W * .1,
        y: rand(0, H * .4),
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        length,
        life: 1,
        decay: rand(.4, .9),
        hue: rand(200, 300),
        brightness: rand(60, 100),
        trail: [],
      };
    }

    // ─── 星座 ─────────────────────────────────────
    function spawnConstellation() {
      if (constellations.length > 3) return;
      const cx = rand(100, W - 100);
      const cy = rand(80, H - 80);
      const count = Math.floor(rand(4, 9));
      const pts = [];
      for (let i = 0; i < count; i++) {
        pts.push({
          x: cx + rand(-80, 80),
          y: cy + rand(-60, 60),
          size: rand(1.5, 3.5),
        });
      }
      return { points: pts, alpha: 0, maxAlpha: rand(.08, .2), pulse: rand(0, Math.PI * 2) };
    }

    // ─── 粒子发射器（鼠标交互） ─────────────────
    function emitParticles(x, y, count = 12) {
      for (let i = 0; i < count; i++) {
        const angle = rand(0, Math.PI * 2);
        const speed = rand(20, 80);
        particleEmitters.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1,
          decay: rand(.01, .025),
          size: rand(1, 3),
          hue: rand(200, 300),
          luminosity: rand(70, 100),
        });
      }
    }

    // ─── 星云 ─────────────────────────────────────
    const nebulae = [];
    function initNebulae() {
      nebulae.length = 0;
      for (let i = 0; i < CONFIG.nebulaCount; i++) {
        nebulae.push({
          x: rand(0, 1),
          y: rand(0, 1),
          radius: rand(.2, .45),
          r: rand(40, 120),
          g: rand(40, 100),
          b: rand(120, 255),
          alpha: rand(.03, .08),
          pulseSpeed: rand(.1, .3),
          phase: rand(0, Math.PI * 2),
        });
      }
    }

    // ─── 月亮 ─────────────────────────────────────
    const moon = { x: .75, y: .18, radius: 55, phase: 0 };
    function drawMoon() {
      const mx = moon.x * W;
      const my = moon.y * H;
      const r = moon.radius;
      moon.phase += .004;

      // 光晕
      const glow = ctx.createRadialGradient(mx, my, 0, mx, my, r * 4);
      glow.addColorStop(0, 'rgba(220, 230, 255, .18)');
      glow.addColorStop(.4, 'rgba(200, 215, 255, .06)');
      glow.addColorStop(1, 'rgba(200, 215, 255, 0)');
      ctx.fillStyle = glow;
      ctx.fillRect(mx - r * 4, my - r * 4, r * 8, r * 8);

      // 月盘
      const moonGrad = ctx.createRadialGradient(mx - r * .3, my - r * .3, r * .1, mx, my, r);
      moonGrad.addColorStop(0, '#f5f7ff');
      moonGrad.addColorStop(.7, '#dbe3f5');
      moonGrad.addColorStop(1, '#b8c4e0');
      ctx.beginPath();
      ctx.arc(mx, my, r, 0, Math.PI * 2);
      ctx.fillStyle = moonGrad;
      ctx.fill();

      // 环形山（月球暗斑）
      const craters = [
        { dx: -r * .35, dy: -r * .2, radius: r * .16, a: .10 },
        { dx: r * .25, dy: -r * .3, radius: r * .10, a: .08 },
        { dx: r * .15, dy: r * .25, radius: r * .20, a: .12 },
        { dx: -r * .1, dy: r * .42, radius: r * .09, a: .06 },
        { dx: -r * .45, dy: r * .15, radius: r * .12, a: .08 },
      ];
      ctx.fillStyle = '#8a94ad';
      for (const cr of craters) {
        ctx.beginPath();
        ctx.arc(mx + cr.dx, my + cr.dy, cr.radius, 0, Math.PI * 2);
        ctx.globalAlpha = cr.a;
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    // ─── 行星 ─────────────────────────────────────
    const planets = [];
    function initPlanets() {
      planets.length = 0;
      const defs = [
        { hue: 25, r: 24, ring: false, sat: 60, lum: 70 },   // 类木星暖色
        { hue: 210, r: 16, ring: true, sat: 70, lum: 80 },   // 带环行星
      ];
      for (let i = 0; i < CONFIG.planets; i++) {
        const d = defs[i % defs.length];
        planets.push({
          x: rand(.08, .35),
          y: rand(.1, .75),
          radius: d.r,
          hue: d.hue,
          sat: d.sat,
          lum: d.lum,
          ring: d.ring,
          spin: rand(0, Math.PI * 2),
          spinSpeed: rand(.2, .6),
          wobble: rand(0, Math.PI * 2),
          wobbleAmp: rand(8, 16),
        });
      }
    }

    function drawPlanet(p) {
      p.spin += .01 * p.spinSpeed;
      const px = p.x * W + Math.sin(p.wobble) * p.wobbleAmp;
      const py = p.y * H;
      const r = p.radius;

      // 光晕
      const glow = ctx.createRadialGradient(px, py, 0, px, py, r * 3);
      glow.addColorStop(0, `hsla(${p.hue}, ${p.sat}%, ${p.lum}%, .12)`);
      glow.addColorStop(1, `hsla(${p.hue}, ${p.sat}%, ${p.lum}%, 0)`);
      ctx.fillStyle = glow;
      ctx.fillRect(px - r * 3, py - r * 3, r * 6, r * 6);

      // 球体（带大气渐变）
      const sphere = ctx.createRadialGradient(px - r * .4, py - r * .4, r * .1, px, py, r);
      sphere.addColorStop(0, `hsla(${p.hue}, ${p.sat}%, ${Math.min(p.lum + 15, 100)}%, 1)`);
      sphere.addColorStop(.6, `hsla(${p.hue}, ${p.sat}%, ${p.lum}%, 1)`);
      sphere.addColorStop(1, `hsla(${p.hue}, ${p.sat}%, ${Math.max(p.lum - 30, 5)}%, 1)`);
      ctx.beginPath();
      ctx.arc(px, py, r, 0, Math.PI * 2);
      ctx.fillStyle = sphere;
      ctx.fill();

      // 行星条纹（类木星）
      if (!p.ring) {
        ctx.globalAlpha = .25;
        ctx.strokeStyle = `hsla(${p.hue - 20}, ${p.sat}%, ${p.lum - 10}%, 1)`;
        ctx.lineWidth = 2;
        for (let i = 0; i < 3; i++) {
          const yOff = (i - 1) * r * .35;
          ctx.beginPath();
          ctx.ellipse(px, py + yOff, r, r * .18, 0, 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
      }

      // 土星环
      if (p.ring) {
        ctx.strokeStyle = `hsla(${p.hue + 30}, 50%, 85%, .5)`;
        ctx.lineWidth = r * .22;
        ctx.beginPath();
        ctx.ellipse(px, py, r * 1.8, r * .5, -.35, 0, Math.PI * 2);
        ctx.stroke();

        ctx.strokeStyle = `hsla(${p.hue + 30}, 50%, 95%, .25)`;
        ctx.lineWidth = r * .12;
        ctx.beginPath();
        ctx.ellipse(px, py, r * 1.45, r * .38, -.35, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    // ─── 星座命名 ─────────────────────────────────
    const CONSTELLATION_NAMES = ['北 斗 七 星', '猎 户 座', '仙 后 座', '天 鹅 座', '狮 子 座', '天 琴 座', '大 熊 座', '飞 马 座'];

    function spawnNamedConstellation() {
      if (constellations.length > 2) return;
      const c = spawnConstellation();
      if (!c) return;
      c.name = CONSTELLATION_NAMES[Math.floor(rand(0, CONSTELLATION_NAMES.length))];
      return c;
    }

    // ─── 更新逻辑 ───────────────────────────────
    function update(dt) {
      time += dt;
      const mx = mouse.x;
      const my = mouse.y;

      // 平滑鼠标
      mouse.x = lerp(mouse.x, mouse.targetX, .08);
      mouse.y = lerp(mouse.y, mouse.targetY, .08);
      mouse.vx = (mouse.x - mx) / dt || 0;
      mouse.vy = (mouse.y - my) / dt || 0;

      // 更新恒星（视差 + 闪烁）
      for (const s of stars) {
        // 鼠标视差偏移
        const dx = (mouse.x - W / 2) * s.parallax * .15;
        const dy = (mouse.y - H / 2) * s.parallax * .15;
        s._px = s.x + dx;
        s._py = s.y + dy;

        // 闪烁
        s.pulse += dt * s.twinkleSpeed;
        const twinkle = 1 + Math.sin(s.pulse) * s.twinkleAmp * .3;
        s.size = s.baseSize * Math.max(.2, twinkle);
      }

      // 更新流星
      for (let i = shootingStars.length - 1; i >= 0; i--) {
        const ss = shootingStars[i];
        ss.x += ss.vx * dt * .3;
        ss.y += ss.vy * dt * .3;
        ss.life -= ss.decay * dt;
        ss.trail.push({ x: ss.x, y: ss.y });
        if (ss.trail.length > 20) ss.trail.shift();
        if (ss.life <= 0 || ss.x > W + 200 || ss.y > H + 200) {
          shootingStars.splice(i, 1);
        }
      }

      // 生成流星
      if (Math.random() < CONFIG.shootingStarRate) {
        const ss = spawnShootingStar();
        if (ss) shootingStars.push(ss);
      }
      // 流星雨模式
      if (meteorRain && Math.random() < .06) {
        const ss = spawnShootingStar();
        if (ss) shootingStars.push(ss);
      }

      // 星座（命名版）
      if (Math.random() < .002 && constellations.length < 3) {
        const c = spawnNamedConstellation();
        if (c) constellations.push(c);
      }
      for (const c of constellations) {
        c.pulse += dt;
        // 淘汰旧的
        c.life = (c.life || 1) - dt * .004;
        if (c.life > 0) {
          c.alpha = Math.min(c.alpha + dt * .3, c.maxAlpha);
        } else {
          c.alpha = Math.max(0, c.alpha - dt * .1);
        }
      }
      constellations = constellations.filter(c => c.alpha > .001);

      // 粒子更新
      for (let i = particleEmitters.length - 1; i >= 0; i--) {
        const p = particleEmitters[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vx *= .96;
        p.vy *= .96;
        p.vy -= 10 * dt; // 微弱上浮
        p.life -= p.decay;
        if (p.life <= 0) particleEmitters.splice(i, 1);
      }

      // 鼠标粒子发射
      const speed = Math.hypot(mouse.vx, mouse.vy);
      if (speed > 30 && Math.random() < .3) {
        emitParticles(mouse.x + rand(-5, 5), mouse.y + rand(-5, 5), 1);
      }

      // 提示隐藏
      if (speed > 10) hint.classList.remove('show');

      updateStarCount();
    }

    // ─── 渲染 ─────────────────────────────────────
    function render() {
      // 清空 — 用渐变背景模拟深空
      const grad = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * .7);
      grad.addColorStop(0, '#0a0e1a');
      grad.addColorStop(.4, '#050810');
      grad.addColorStop(1, '#000000');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);

      // 星云
      for (const nb of nebulae) {
        const pulse = 1 + Math.sin(time * nb.pulseSpeed + nb.phase) * .15;
        const grd = ctx.createRadialGradient(
          nb.x * W, nb.y * H, 0,
          nb.x * W, nb.y * H, nb.radius * Math.max(W, H) * pulse
        );
        grd.addColorStop(0, `rgba(${nb.r},${nb.g},${nb.b},${nb.alpha * 1.5})`);
        grd.addColorStop(.5, `rgba(${nb.r},${nb.g},${nb.b},${nb.alpha})`);
        grd.addColorStop(1, `rgba(${nb.r},${nb.g},${nb.b},0)`);
        ctx.fillStyle = grd;
        ctx.fillRect(0, 0, W, H);
      }

      // 月亮
      if (CONFIG.moon) drawMoon();

      // 行星
      for (const p of planets) drawPlanet(p);

      // ---- 按图层排序绘制恒星 ----
      const sorted = [...stars].sort((a, b) => a.z - b.z);
      for (const s of sorted) {
        const px = s._px;
        const py = s._py;
        // 边缘柔和裁剪
        if (px < -10 || px > W + 10 || py < -10 || py > H + 10) continue;

        const alpha = .4 + s.z * .6;
        const sz = s.size;
        const lumin = s.luminosity;

        // 核心光晕
        if (sz > 1.8) {
          const glow = ctx.createRadialGradient(px, py, 0, px, py, sz * 4);
          glow.addColorStop(0, `hsla(${s.hue}, ${s.saturation}%, ${lumin}%, ${alpha * .15})`);
          glow.addColorStop(1, `hsla(${s.hue}, ${s.saturation}%, ${lumin}%, 0)`);
          ctx.fillStyle = glow;
          ctx.fillRect(px - sz * 4, py - sz * 4, sz * 8, sz * 8);
        }

        // 恒星本体
        ctx.beginPath();
        ctx.arc(px, py, sz, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${s.hue}, ${s.saturation}%, ${lumin}%, ${alpha})`;
        ctx.fill();

        // 十字光芒（亮星）
        if (sz > 2.2) {
          ctx.strokeStyle = `hsla(${s.hue}, 40%, ${lumin}%, ${alpha * .08})`;
          ctx.lineWidth = .5;
          const spikeLen = sz * 3;
          for (let a = 0; a < 4; a++) {
            const angle = a * Math.PI / 4 + s.pulse * .1;
            ctx.beginPath();
            ctx.moveTo(px - Math.cos(angle) * spikeLen, py - Math.sin(angle) * spikeLen);
            ctx.lineTo(px + Math.cos(angle) * spikeLen, py + Math.sin(angle) * spikeLen);
            ctx.stroke();
          }
        }
      }

      // ---- 星座 ----
      for (const c of constellations) {
        const a = c.alpha * (.6 + Math.sin(c.pulse) * .4) * Math.max(0, Math.min(1, (c.life ?? 1) * 3));
        ctx.strokeStyle = `rgba(180, 200, 255, ${a * .3})`;
        ctx.lineWidth = .5;
        ctx.setLineDash([2, 4]);
        for (let i = 0; i < c.points.length - 1; i++) {
          ctx.beginPath();
          ctx.moveTo(c.points[i].x, c.points[i].y);
          ctx.lineTo(c.points[i + 1].x, c.points[i + 1].y);
          ctx.stroke();
        }
        ctx.setLineDash([]);

        for (const p of c.points) {
          const glow = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * 4);
          glow.addColorStop(0, `rgba(200, 220, 255, ${a * .12})`);
          glow.addColorStop(1, 'rgba(200, 220, 255, 0)');
          ctx.fillStyle = glow;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * 4, 0, Math.PI * 2);
          ctx.fill();

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(220, 235, 255, ${a})`;
          ctx.fill();
        }

        // 星座名称标签
        if (c.name && a > .04) {
          const cx = c.points.reduce((s, p) => s + p.x, 0) / c.points.length;
          const cy = c.points.reduce((s, p) => s + p.y, 0) / c.points.length;
          const na = Math.min(a * 1.5, .7);
          ctx.font = '12px "Segoe UI", system-ui, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillStyle = `rgba(200, 215, 255, ${na})`;
          ctx.fillText(c.name, cx, cy - 22);
          ctx.font = '8px "Segoe UI", system-ui, sans-serif';
          ctx.fillStyle = `rgba(180, 200, 255, ${na * .4})`;
          ctx.fillText('✦ constellation', cx, cy - 10);
        }
      }

      // ---- 流星 ----
      for (const ss of shootingStars) {
        const alpha = Math.max(0, ss.life);
        ctx.save();

        // 拖尾
        for (let i = 0; i < ss.trail.length; i++) {
          const t = ss.trail[i];
          const ta = (i / ss.trail.length) * alpha * .4;
          const ts = 1 + (i / ss.trail.length) * 3;
          ctx.beginPath();
          ctx.arc(t.x, t.y, ts, 0, Math.PI * 2);
          ctx.fillStyle = `hsla(${ss.hue}, 80%, ${ss.brightness}%, ${ta})`;
          ctx.fill();
        }

        // 流星头
        const grad2 = ctx.createRadialGradient(ss.x, ss.y, 0, ss.x, ss.y, 8);
        grad2.addColorStop(0, `hsla(${ss.hue}, 70%, ${ss.brightness}%, ${alpha * .8})`);
        grad2.addColorStop(.5, `hsla(${ss.hue}, 70%, ${ss.brightness}%, ${alpha * .3})`);
        grad2.addColorStop(1, `hsla(${ss.hue}, 70%, ${ss.brightness}%, 0)`);
        ctx.fillStyle = grad2;
        ctx.beginPath();
        ctx.arc(ss.x, ss.y, 8, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      // ---- 鼠标粒子 ----
      for (const p of particleEmitters) {
        const alpha = Math.max(0, p.life);
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${p.hue}, 80%, ${p.luminosity}%, ${alpha * .6})`;
        ctx.fill();
      }

      // ---- 鼠标光标光晕 ----
      if (Math.hypot(mouse.vx, mouse.vy) > 5) {
        cursorGlow.classList.add('active');
      } else {
        cursorGlow.classList.remove('active');
      }
      cursorGlow.style.left = mouse.x + 'px';
      cursorGlow.style.top = mouse.y + 'px';
    }

    // ─── FPS ──────────────────────────────────────
    function updateFps(now) {
      frameCount++;
      if (now - fpsTimer >= 1000) {
        fps = frameCount;
        fpsEl.textContent = `${fps} FPS`;
        frameCount = 0;
        fpsTimer = now;
      }
    }

    // ─── 主循环 ──────────────────────────────────
    function loop(now) {
      const dt = Math.min((now - lastFrame) / 1000, .05);
      lastFrame = now;

      update(dt);
      render();
      updateFps(now);
      requestAnimationFrame(loop);
    }

    // ─── 事件绑定 ────────────────────────────────
    window.addEventListener('resize', resize);

    document.addEventListener('mousemove', e => {
      mouse.targetX = e.clientX;
      mouse.targetY = e.clientY;
    });

    document.addEventListener('touchmove', e => {
      const t = e.touches[0];
      mouse.targetX = t.clientX;
      mouse.targetY = t.clientY;
    }, { passive: true });

    document.addEventListener('touchstart', e => {
      const t = e.touches[0];
      mouse.targetX = mouse.x = t.clientX;
      mouse.targetY = mouse.y = t.clientY;
    }, { passive: true });

    // 点击生成粒子爆发 + 流星方向
    document.addEventListener('click', e => {
      emitParticles(e.clientX, e.clientY, 80);
      // 向点击方向发射一颗流星
      const angle = Math.atan2(e.clientY - mouse.y, e.clientX - mouse.x) - rand(.1, .4);
      shootingStars.push({
        x: mouse.x + rand(-20, 20),
        y: mouse.y + rand(-20, 20),
        vx: Math.cos(angle) * rand(400, 700),
        vy: Math.sin(angle) * rand(300, 500),
        length: rand(60, 150),
        life: 1,
        decay: rand(.3, .6),
        hue: rand(200, 300),
        brightness: rand(70, 100),
        trail: [],
      });
    });

    // 右键流星雨
    document.addEventListener('contextmenu', e => {
      e.preventDefault();
      emitParticles(e.clientX, e.clientY, 30);
      for (let i = 0; i < 6; i++) {
        setTimeout(() => {
          if (shootingStars.length >= 8) return;
          const angle = rand(-.6, .6) - Math.PI / 2 + rand(-.3, .3);
          shootingStars.push({
            x: rand(e.clientX - 100, e.clientX + 100),
            y: rand(e.clientY - 80, e.clientY + 80),
            vx: Math.cos(angle) * rand(600, 1200),
            vy: Math.sin(angle) * rand(400, 800),
            length: rand(80, 180),
            life: 1,
            decay: rand(.4, .7),
            hue: rand(180, 300),
            brightness: rand(70, 100),
            trail: [],
          });
        }, i * 120);
      }
    });

    // 双击切换 UI 隐藏 / 流星雨模式
    document.addEventListener('dblclick', e => {
      emitParticles(e.clientX, e.clientY, 60);
      if (e.shiftKey) {
        meteorRain = !meteorRain;
        return;
      }
      uiHidden = !uiHidden;
      titleEl.classList.toggle('hidden', uiHidden);
      statsEl.classList.toggle('hidden', uiHidden);
      cursorGlow.style.display = uiHidden ? 'none' : 'block';
    });

    // ─── 启动 ─────────────────────────────────────
    resize();
    initNebulae();
    initPlanets();
    lastFrame = performance.now();
    fpsTimer = lastFrame;
    requestAnimationFrame(loop);
  </script>
</body>
</html>
